name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && !contains(github.event.issue.labels.*.name, 'bug')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && !contains(github.event.issue.labels.*.name, 'bug') && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Record existing Claude branches
        id: pre-claude
        run: |
          git fetch --all --quiet
          BRANCHES=$(git ls-remote --heads origin 'refs/heads/claude/*' | awk '{print $2}' | sort | tr '\n' '|')
          echo "branches=$BRANCHES" >> $GITHUB_OUTPUT

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: '--dangerously-skip-permissions'
          show_full_output: 'true'

      - name: Open PR for new Claude branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git fetch --all --quiet
          BEFORE="${{ steps.pre-claude.outputs.branches }}"
          NEW_BRANCH=""
          while IFS= read -r ref; do
            branch="${ref#refs/heads/}"
            if [[ "$BEFORE" != *"refs/heads/$branch|"* ]]; then
              NEW_BRANCH="$branch"
              break
            fi
          done < <(git ls-remote --heads origin 'refs/heads/claude/*' | awk '{print $2}' | sort)
          if [ -n "$NEW_BRANCH" ]; then
            echo "Creating PR for branch: $NEW_BRANCH"
            gh pr create \
              --base master \
              --head "$NEW_BRANCH" \
              --title "fix: changes from Claude for issue #${ISSUE_NUMBER}" \
              --body "Resolves #${ISSUE_NUMBER}" || echo "PR already exists or failed"
          else
            echo "No new Claude branch detected, skipping PR creation"
          fi

  claude-bug-fix:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && contains(github.event.issue.labels.*.name, 'bug')) ||
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'bug') && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup database
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start development server
        run: npm run dev &

      - name: Wait for server to be ready
        run: |
          echo "Waiting for dev server on port 3000..."
          timeout 60 bash -c 'until curl -sf http://localhost:3000 > /dev/null 2>&1; do sleep 2; done'
          echo "Server is ready"

      - name: Record existing fix branches
        id: pre-claude
        run: |
          git fetch --all --quiet
          BRANCHES=$(git ls-remote --heads origin 'refs/heads/fix/*' | awk '{print $2}' | sort | tr '\n' '|')
          echo "branches=$BRANCHES" >> $GITHUB_OUTPUT

      - name: Write Playwright MCP config
        run: |
          cat > /tmp/mcp-playwright.json << 'EOF'
          {
            "mcpServers": {
              "playwright": {
                "command": "npx",
                "args": ["@playwright/mcp@latest", "--headless"]
              }
            }
          }
          EOF

      - name: Run Claude Code with Playwright MCP
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: '--mcp-config /tmp/mcp-playwright.json --dangerously-skip-permissions'
          show_full_output: 'true'
          prompt: |
            You are helping fix a bug reported in GitHub issue #${{ github.event.issue.number }}.

            **Issue title:** ${{ github.event.issue.title }}

            **Issue description:**
            ${{ github.event.issue.body }}

            The development server is running at http://localhost:3000. Follow these steps:

            ## Step 1: Reproduce the bug
            Use the Playwright MCP tools to navigate to http://localhost:3000 and attempt to reproduce the issue exactly as described. Document what you observe.

            ## Step 2a: If the bug IS reproduced
            1. Analyze the codebase to identify the root cause
            2. Implement a fix
            3. Run `npm test` to verify existing tests still pass
            4. Use Playwright to confirm the fix resolves the issue
            5. Commit your changes with a descriptive message

            ## Step 2b: If the bug CANNOT be reproduced
            Post a comment on the issue describing exactly what you tried, what you observed, and request any additional details needed to reproduce it.

      - name: Open PR for new fix branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git fetch --all --quiet
          BEFORE="${{ steps.pre-claude.outputs.branches }}"
          NEW_BRANCH=""
          while IFS= read -r ref; do
            branch="${ref#refs/heads/}"
            if [[ "$BEFORE" != *"refs/heads/$branch|"* ]]; then
              NEW_BRANCH="$branch"
              break
            fi
          done < <(git ls-remote --heads origin 'refs/heads/fix/*' | awk '{print $2}' | sort)
          if [ -n "$NEW_BRANCH" ]; then
            echo "Creating PR for branch: $NEW_BRANCH"
            gh pr create \
              --base master \
              --head "$NEW_BRANCH" \
              --title "fix: bug from issue #${ISSUE_NUMBER}" \
              --body "Resolves #${ISSUE_NUMBER}" || echo "PR already exists or failed"
          else
            echo "No new fix branch detected, skipping PR creation"
          fi
